<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำลังโหลด Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #090909;
      color: #f7f5f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(135deg, #111 0%, #1a1a1a 55%, #040404 100%);
      color: #f7f5f2;
    }

    .loader-card {
      width: min(420px, 100%);
      padding: 2rem;
      border-radius: 28px;
      background: rgba(22, 22, 22, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(24px);
    }

    .spinner {
      width: 92px;
      height: 92px;
      margin: 0 auto 1.6rem;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top-color: #f7f5f2;
      animation: spin 1.1s linear infinite;
      position: relative;
    }

    .spinner::before {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: clamp(1.5rem, 2.2vw, 2.25rem);
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
    }

    p {
      color: #c8c5c0;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .subtitle {
      color: #a8a39f;
      font-size: 0.95rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>กำลังโหลด Portfolio</h1>
    <p>กรุณารอสักครู่ ขณะเราเตรียมหน้า Portfolio ของคุณให้พร้อม</p>
    <p class="subtitle">ถ้าไม่ถูกเปลี่ยนเส้นทางโดยอัตโนมัติ ให้คลิก <a href="/portfolio.html" style="color:#f7f5f2; text-decoration: underline;">ที่นี่</a></p>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = '/portfolio.html';
    }, 1400);
  </script>
</body>
</html>
